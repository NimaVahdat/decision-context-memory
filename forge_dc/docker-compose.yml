# Postgres + pgvector for the forge_dc approach.
#
# NOTE: each approach folder in this repo runs its own Postgres on
# host port 5432. To run several approach folders at the same time,
# give each one a DISTINCT host port (e.g. "5433:5432") and point
# its DEFAULT_DB_URL at that port.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dc
      POSTGRES_PASSWORD: dc
      POSTGRES_DB: dc_forge
    ports:
      - "5432:5432"
    volumes:
      - forge_dc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dc -d dc_forge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  forge_dc_pgdata:
