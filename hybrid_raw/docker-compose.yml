# Postgres + pgvector for the hybrid_raw approach.
# NOTE: running multiple approach folders at once requires distinct host
# ports — change the left side of "5432:5432" (e.g. "5433:5432") per folder
# and update the db_url passed to build() accordingly.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dc
      POSTGRES_PASSWORD: dc
      POSTGRES_DB: dc_hybrid_raw
    ports:
      - "5432:5432"
    volumes:
      - hybrid_raw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dc -d dc_hybrid_raw"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hybrid_raw_pgdata:
